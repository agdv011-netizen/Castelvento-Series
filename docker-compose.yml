version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: castelvento-db
    environment:
      POSTGRES_USER: ${DB_USER:-castelvento}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-castelvento_dev_password}
      POSTGRES_DB: ${DB_NAME:-castelvento}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - castelvento-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-castelvento}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: castelvento-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - castelvento-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  castelvento-network:
    driver: bridge
